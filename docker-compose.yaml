services:
  frontend:
    container_name: frontend
    image: battleship-frontend
    build:
      context: .
      dockerfile: ./apps/frontend/Dockerfile
    ports:
      - '5173:5173'
    volumes:
      - .:/usr/src/frontend
    depends_on:
      app:
        condition: service_healthy
    env_file:
      - .env.development.docker
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:3000 || exit 1']
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 3s
    command: pnpm dev --open

  backend:
    container_name: backend
    image: battleship-backend
    build:
      context: .
      dockerfile: ./apps/backend/Dockerfile
    ports:
      - '3000:3000'
    volumes:
      - .:/usr/src/backend
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env.development.docker
    healthcheck:
      test: ['CMD-SHELL', './docker/app/healthcheck.sh']
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 3s
    command: sh -c "chmod +x ./docker/app/healthcheck.sh && pnpm start:dev"

  db:
    container_name: db
    image: battleship-db
    build:
      context: .
      dockerfile: ./apps/db/Dockerfile
    ports:
      - '5432:5432'
    env_file:
      - .env.development.docker
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 3s
