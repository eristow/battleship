services:
  frontend:
    container_name: frontend
    image: battleship-frontend
    build:
      context: .
      dockerfile: ./docker/frontend/Dockerfile
    ports:
      - '8080:8080'
    volumes:
      - ./apps/frontend:/usr/src/app/apps/frontend
    depends_on:
      backend:
        condition: service_healthy
    env_file:
      - .env.development.docker
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:3000 || exit 1']
      interval: 60s
      timeout: 30s
      retries: 5
      start_period: 1s
    command: pnpm dev

  backend:
    container_name: backend
    image: battleship-backend
    build:
      context: .
      dockerfile: ./docker/backend/Dockerfile
    ports:
      - '3000:3000'
    volumes:
      - ./apps/backend:/usr/src/app/apps/backend
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env.development.docker
    healthcheck:
      test: ['CMD-SHELL', './healthcheck.sh']
      interval: 60s
      timeout: 30s
      retries: 5
      start_period: 1s
    command: sh -c "chmod +x ./healthcheck.sh && pnpm dev"

  db:
    container_name: db
    image: battleship-db
    build:
      context: .
      dockerfile: ./docker/db/Dockerfile
    ports:
      - '5432:5432'
    env_file:
      - .env.development.docker
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 60s
      timeout: 30s
      retries: 5
      start_period: 1s
